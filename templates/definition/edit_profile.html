{% extends 'base.html' %}
{% block content %}

<style>
 
    .table-containere {
        display: flex;
        flex-direction: column;
        border: 1px solid #ddd;
    }
    .form-container {
        width: 50%;
        padding: 0 20px; 
        text-align: left; 

    }

    .error {
        color: red;
    }

    label {
        display: block;
        margin-bottom: 8px;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 8px;
        margin-bottom: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
</style>

<div class="text">Edit Profile</div>

<div class="table-container filtro">
    <div class="form-container">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="photo">
                {% if form.instance.photo %}
                    <img src="{{ form.instance.photo.url }}" alt="Foto Atual" style="max-height: 100px;">
                    <label for="photo-clear_id">Currently:</label>
                    <a href="{{ form.instance.photo.url }}">{{ form.instance.photo.url }}</a>
                    <input type="checkbox" name="photo-clear" id="photo-clear_id" class="clear-option">
                    <label for="photo-clear_id">Clear</label>
                    
                {% endif %}
                
                Change:
                <input type="file" name="photo" accept="image/*" id="id_photo">
            </div>

            <div>
                <label for="id_description">Descrição</label>
                <input type="text" name="description" value="{{ form.description.value }}" required id="id_description">
            </div>

            <button type="submit">Save Changes</button>
        </form>
    </div>
</div>

{% load static %}
<script src="{% static 'definition/js/script.js' %}"></script>

{% endblock %}
