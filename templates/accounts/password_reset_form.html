{% extends 'baselogin.html' %}
{% block title %}Formulário de recuperação de password {% endblock %}
	{% block content %}

        <div class="login__forms">
                  
            <form action="" method="post" class="login__registre" id="login-in">
                {% csrf_token %}
                
                <h1 class="login__title">Insira a nova Password</h1>

                <div class="login__box">
                    <i class='bx bx-lock-alt login__icon'></i>
                    <input type="password" name="new_password1" placeholder="Nova Password" autocomplete="new-password" required id="id_new_password1" class="login__input">
                </div>

                <div class="login__box">
                    <i class='bx bx-lock-alt login__icon'></i>
                    <input type="password" name="new_password2" placeholder="Confirma a Password" autocomplete="new-password" required id="id_new_password2" class="login__input">
                </div>
                {% if form.errors %}
                    <div class="errorlist">
                        <strong>Error:</strong>
                        {{ form.errors }}
                    </div>
                {% endif %}

                <br>
                <button type="submit" class="botao-tabela">Entrar</button>
                <br><br>

                  <div>
                    <span class="login__account">Volte para o</span>
                    <a href="{% url 'user_login' %}" class="login__signin" id="sign-in">Log in</a>
                </div>
              </form>
          
        </div>

    {% endblock %}
