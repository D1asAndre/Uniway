{% extends 'baselogin.html' %}
{% block title %}Recuperação da Password {% endblock %}
	{% block content %}
    

            <div class="login__forms">
                    
                <form action="" method="post" class="login__registre" id="login-in">
                    {% csrf_token %}
                    <h1 class="login__title">Password Reset</h1>

                    <div class="login__box">
                        <i class='bx bx-user login__icon'></i>
                        <input type="text" placeholder="E-mail" name="email" class="login__input">
                    </div>

                    <!--<a href="#" type="submit" class="login__button">Sign In</a>-->
                    <br>
                        <button type="submit" class="botao-tabela">Entrar</button>
                        <br><br>

                    <div>
                        <span class="login__account">Volte para o</span>
                        <a href="{% url 'user_login' %}" class="login__signin" id="sign-in">Log In.</a>
                    </div>
                </form>
            
            </div>
    {% endblock %}
