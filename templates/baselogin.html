{% load static %}

<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{% static 'accounts/img/UniwayFaviconLogo.png' %}" type="image/x-icon">
    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="/static/accounts/css/SignIn_LogIn.css">
    <!-- ===== BOX ICONS ===== -->
    <link href='https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css' rel='stylesheet'>

    <title>{% block title %}{% endblock %}</title>
</head>
<body>
<div class="api-button">
</div>
<div class="login">
    <div class="login__content">
        <div class="login__img">
            <img src="{% static 'accounts/img/UniwayLogo.png' %}" alt="logo">

        </div>

        <div class="login__forms">

            <section class="home">
                {% block content %}{% endblock %}
            </section>
            {% block scripts %}{% endblock %}

        </div>
    </div>
</div>
</body>
</html>
