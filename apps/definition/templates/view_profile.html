{% extends 'base.html' %}
    {% block content %}

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    

        <div>
            <a class="botao-tabela" href="{% url 'definition:edit_profile' %}">Editar Perfil</a>
            <button class="botao-tabela" onclick="window.location.href='/addboleia/home/?destino='">Voltar</button>
        </div>

    {% endblock %}
