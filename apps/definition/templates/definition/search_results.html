{% extends 'base.html' %}
{% block content %}

<style>
    input[type="text"],
    input[type="date"],
    input[type="time"],
    input[type="number"],
    select {
        width: 20%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    .filtro {
        text-align: center;
        padding: 20px;
        margin-left: 50px;
        margin-right: 50px;
        border-radius: 6px;
        background-color: #ffffff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .filt-container {
        text-align: center;
    }

    .filt {
        text-align: center;
        padding: 20px;
        width: 23%;
        margin: 1%;
        border-radius: 6px;
        background-color: #ffffff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        display: inline-block;
        box-sizing: border-box;
        cursor: pointer;
    }

    .filt a {
        text-decoration: none;
        color: #000;
    }

    .filtr{
        text-align: center;
        padding: 20px;
        margin-left: 50px;
        margin-right: 50px;
        border-radius: 6px;
        background-color: #ffffff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
</style>

<div class="text">Resultados da Pesquisa</div>
<br>
<br>
<div class="filtro">
    <form method="get" action="{% url 'definition:search_users' %}">
        <label for="{{ form.search_query.id_for_label }}">Pesquisar:</label>
        {{ form.search_query }}
        <button style="float: right;" class="botao-tabela-cinza" type="submit">Pesquisar</button>
    </form>
</div>
<br><br>

{% if results %}
    <div class="filt-container">
        {% for user in results %}
            <div class="filt" onclick="window.location='{% url 'definition:perfil_usuario' user.username %}'">
                <a href="{% url 'definition:perfil_usuario' user.username %}">{{ user.username }}</a>
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="filtr">
        <p>Nenhum resultado encontrado.</p>
    </div>
{% endif %}

{% endblock %}
