{% extends 'base.html' %}

{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
    <h2>Confirmar Exclusão</h2>
    <p>Você está prestes a excluir o registro com o número de matrícula {{ num_mec }}.</p>

    <form method="post" action="{% url 'excluir_registro' num_mec %}">
        {% csrf_token %}
        <button type="submit">Confirmar Exclusão</button>
    </form>

    <p><a href="{% url 'listar_registo' %}">Cancelar e Voltar para a Página de Listar</a></p>
{% endblock %}
