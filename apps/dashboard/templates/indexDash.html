{% extends 'base.html' %}
{% block content %}
<style>
  
  #minititle{
    font-size: 16px;
   
  }
  /* Common styles for the table container */
  .table-container{
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      flex-direction: column;
      border: 0px solid #ddd;
      margin-left: 50px;
      margin-right: 50px;
  }

  /* Styles for the charts */
  .chart-container {
      height: 300px;
  }

  /* Styles for the map */
  #map_div {
      height: 500px;
      margin-right: 50px;
  }

  /* Styles for the bar chart */
  #chart_div {
    height: 200px;
    margin-right: 50px;
}

  .row {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    border: 0px solid #ddd;
    margin-left: 0px;
    margin-right: 50px;
    width: 100%; /* Add this line */
}

  .row > div {
      flex: 1; /* Add this line */
      
  }



</style>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load('current', {'packages':['corechart']});
      google.charts.setOnLoadCallback(drawChart);
      
      function drawChart() {
        var data = new google.visualization.arrayToDataTable([
          ['Destino', 'Quantidade de Boleias'],
          {% for destino in destinos_contados %}
            ['{{ destino.destino|safe }}', {{ destino.quantidade }}],
          {% endfor %}
        ]);
        var options = {
            title: 'Todas os destinos das Boleias',
            is3D: true,
            width: '100%',
            height: 400,
            bar: {groupWidth: "65%"},
        };
        var chart = new google.visualization.PieChart(document.getElementById('piechart3d'));
        
        chart.draw(data, options);
      }
    </script>
    <script>
      google.charts.load('current', {'packages':['corechart', 'bar']});
      google.charts.setOnLoadCallback(drawChartHist);
      
      function drawChartHist() {
        var data = new google.visualization.arrayToDataTable([
          ['Destino', 'Quantidade de Boleias'],
          {% for destino in destinos_historico %}
            ['{{ destino.destino|safe }}',{{ destino.quantidade }}],
          {% endfor %}
        ]);
        var options = {
            title: 'Todas os destinos de Todas as Boleias Finalizadas',
            is3D: false,
            width: '100%',
            height: 400,
            bar: {groupWidth: "65%"},
        };
        var chart = new google.visualization.PieChart(document.getElementById('piechart'));
        
        chart.draw(data, options);
      }

    </script>
    <script>
      google.charts.load('current', {packages: ['corechart', 'bar']});
      google.charts.setOnLoadCallback(drawRightY);

      function drawRightY() {
          var data = new google.visualization.arrayToDataTable([
          ['Destino', 'Quantidade de Boleias Finalizadas', 'Quantidade Cancelada'],
          {% for destino in destinos_historico_contados %}
            ['{{ destino.destino|safe }}',{{ destino.quantidade_finalizada }},{{ destino.quantidade_cancelada| safe }}],
          {% endfor %}
        ]);

            var materialOptions = {
              chart: {
                title: 'Boleias Finalizadas ou Canceladas',
              },
              hAxis: {
                title: 'Polo UA',
                minValue: 0,
              },
              vAxis: {
                title: 'Boleias'
              },
              bars: 'horizontal',
              axes: {
                y: {
                  0: {side: 'right'}
                }
              }
            };

            var options = {
              width: '100%',
              height: 400,
              bar: {groupWidth: "65%"},
          };
            var materialChart = new google.charts.Bar(document.getElementById('chart_div'));
            materialChart.draw(data, materialOptions, options);
          }
        </script>
    <script type="text/javascript">
        google.charts.load('current', {
          'packages': ['map'],
          // Note: you will need to get a mapsApiKey for your project.
          // See: https://developers.google.com/chart/interactive/docs/basic_load_libs#load-settings
          'mapsApiKey': 'AIzaSyA5T5hTNTE_29t3Hdilo470G35BpBzan4s'
        });
        google.charts.setOnLoadCallback(drawMap);
    
        function drawMap () {
            var data = new google.visualization.DataTable();
            console.log("debug");
            console.log({{ origens_local|safe }});
            data.addColumn('string', 'Origem');
            data.addColumn('string', 'Destino');
    
            {% for origem_local in origens_local %}
                data.addRow(['{{ origem_local.origem|escapejs }}', '{{ origem_local.destino|escapejs }}']);
            {% endfor %}


          var url = 'https://icons.iconarchive.com/icons/icons-land/vista-map-markers/48/';
    
          var options = {
            viewMode: 'mapa',
            zoomLevel: 9,
            showTooltip: true,
            showInfoWindow: true,
            useMapTypeControl: true,
            icons: {
                default: {
                    normal:   url + 'Map-Marker-Ball-Pink-icon.png',
                    selected: url + 'Map-Marker-Ball-Right-Pink-icon.png'
                }
              }        
          };

          var map = new google.visualization.Map(document.getElementById('map_div'));
          
          google.visualization.events.addListener(map, 'select', function() {
            // Recupere as coordenadas da posição clicada
            var selection = map.getSelection()[0];
            var origem = data.getValue(selection.row, 0);
            var destino = data.getValue(selection.row, 1);
    
            // Exiba uma mensagem (você pode personalizar isso conforme necessário)
            alert('Origem: ' + origem + '\nDestino: ' + destino);
        });
    
          map.draw(data, options);
        }
      </script>     
    <div class="table-container">
      <div class="text">Dashboard</div>
      <div class="text" id="minititle">Origens das Boleias</div>
      <div id="map_div"></div><br>
      <br>
      <div id="chart_div"></div><br>
      <div class="row">
        <div class="col-md-6">
          <div id="piechart3d" style="height: 300px;"></div>
        </div>
        <div class="col-md-6">
          <div id="piechart" style="height: 300px;"></div>
        </div>
      </div>
 
    </div>

{% endblock %}
