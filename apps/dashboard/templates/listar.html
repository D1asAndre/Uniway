{% extends 'base.html' %}

{% block content %}
    <h2>Listar Registos</h2>
    <ul>
        {% for registo in registos %}
            <tr>
                <li><a href="{% url 'listarId' registo.id %}">{{ registo.nome }}</a></li>
            </tr>
        {% endfor %}
    </ul>
    <br>
{% endblock %}
