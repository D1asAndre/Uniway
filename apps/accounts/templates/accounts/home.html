{% extends 'baselogin.html' %}
{% block title %}Registo {% endblock %}
	{% block content %}
    

                <div class="login__forms">
                
                    <form action="." method="post" class="login__create " id="login-up">
                        <h1 class="login__title">Registe-se</h1>
                    
                        <div class="login__box">
                            <i class='bx bx-user login__icon'></i>
                            <input type="text" name="username" placeholder="Username" class="login__input" required>
                        </div>

                        <div class="login__box">
                            <i class='bx bx-user login__icon'></i>
                            <input type="text" name="first_name" placeholder="Nome" class="login__input" required>
                        </div>
                    
                        <div class="login__box">
                            <i class='bx bx-at login__icon'></i>
                            <input type="text" name="email" placeholder="Email" class="login__input" required>
                        </div>
                    
                        <div class="login__box">
                            <i class='bx bx-lock-alt login__icon'></i>
                            <input type="password" name="password1" placeholder="Password" class="login__input" required>
                        </div>
                        <div class="login__box">
                            <i class='bx bx-lock-alt login__icon'></i>
                            <input type="password" name="password2" placeholder="Confirm Password" class="login__input" required>
                        </div>
                    
                        {% csrf_token %}
                    
                        <br>
                        <button type="submit" class="botao-tabela">Criar conta</button>
                        <br><br>

                        {% if messages %}
                        <div class="messages">
                            {% for message in messages %}
                                <div class="message {% if message.tags %}{{ message.tags }}{% endif %}">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
                    
                    <br>
                        
                        <div>
                            <span class="login__account">Já tem conta? Faça</span>
                            <a href="{% url 'user_login' %}" class="login__signin" id="sign-in">Login</a>
                        </div>
                    </form>
    
                </div>
    {% endblock %}
